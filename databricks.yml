# SPIN TO WIN — a 3D prize wheel as a Databricks App. ONE command installs it:
#
#     DATABRICKS_CONFIG_PROFILE=<profile> databricks bundle deploy -t dev
#
# The predeploy hook writes `app/app.yaml` from the variables below; the postdeploy hook starts and deploys
# the app and then REFUSES TO FINISH unless the running app's own /api/health agrees about which code it is
# serving. Nothing else to run and nothing to click.
#
# ⛔ PUT THE AUTH IN THE ENVIRONMENT, NOT IN `-p`. The postdeploy hook shells out to the CLI and inherits
#    only the environment, so under `-p myprofile` alone `DATABRICKS_CONFIG_PROFILE` is EMPTY, the hook's
#    own calls go to the DEFAULT profile's workspace, and nothing errors. The hook hard-stops on that.
#
# COMPONENTS: exactly one. This app. No warehouse, no table, no job, no Genie space, no secret scope, no
# model endpoint — the prize list and the uploaded pictures live in the app's own service principal's
# workspace home (see app/lib/store.py), which needs no grant and no extra scope.
bundle:
  name: spin-wheel

# `app/app.yaml` is COMMITTED (so the manual zip-upload install works unedited) and also REGENERATED by the
# predeploy hook. An explicit include costs nothing and means a future .gitignore change cannot silently
# strip it from the upload — which is exactly how another app in this workspace came up with no environment
# at all, twice in one afternoon, while every deploy step reported success.
sync:
  include:
    - app/app.yaml

variables:
  app_name:
    description: >-
      ⛔ THIS IS THE APP'S IDENTITY, NOT A LABEL. Changing it makes terraform DESTROY and RECREATE the app,
      which mints a BRAND NEW service principal — and since the prize list lives under
      /Users/<that-client-id>/, a rename ORPHANS EVERY CONFIGURED PRIZE AND PICTURE. Pick it once and keep
      it (default spin-wheel, the same name the DEPLOY notebook uses).
    default: spin-wheel
  event_name:
    description: The title shown across the top of the wheel. Safe to change freely.
    default: Spin to Win
  audience_group:
    description: >-
      Workspace group granted CAN_USE on the app. Without the permissions block below, a one-line deploy
      leaves the ACL as {creator: CAN_MANAGE, admins: CAN_MANAGE} with `users` absent from both — so nobody
      else in the workspace can open it, and nothing anywhere says so.
    default: users
  cruise_deg_s:
    description: >-
      The speed the wheel holds while it waits for someone to press STOP, in degrees per second. 660 is
      about 1.8 turns a second: fast and alive, and below the point where the segments strobe.
    default: "660"
  spinup_seconds:
    description: How long it takes to ease up to the cruising speed. STOP arms at the end of this.
    default: "1.15"
  spindown_min_turns:
    description: >-
      The minimum the wheel turns after STOP is pressed, so it reads as a wheel slowing down rather than a
      wheel being switched off. The landing is exact regardless — see app/static/js/wheel.js.
    default: "2"
  spindown_exponent:
    description: >-
      Shape of the deceleration. It also FIXES its duration, because the deceleration's first instant has to
      match the speed the wheel was already turning at; 3.4 gives a 4-6s stop from the default cruise speed.
    default: "3.4"

resources:
  apps:
    spin_wheel:
      name: ${var.app_name}
      description: "Spin to Win — a 3D prize wheel. Press Spin; the contestant presses Stop."
      source_code_path: ./app
      # ⛔ NO `resources:` KEY AT ALL, and the absence is deliberate. To mean "bind nothing" it must be
      #    OMITTED — an empty list `resources: []` makes the terraform provider fail with "Provider produced
      #    inconsistent result after apply ... was cty.ListValEmpty, but now null", AFTER creating the app,
      #    leaving a half-built app that the next deploy lands on top of. This app needs no bound resource:
      #    it writes to its own service principal's workspace home, which needs no grant.
      #
      # ⛔ AND NO `user_api_scopes` EITHER. The app never acts as the viewer — it acts as ITSELF, using the
      #    DATABRICKS_CLIENT_ID/SECRET that Apps injects. Adding a scope here would add a consent screen for
      #    every guest and buy nothing.
      permissions:
        - group_name: ${var.audience_group}
          level: CAN_USE

# ⚠️ The hook location the CLI's own JSON schema documents (a TOP-LEVEL `scripts:`) is INERT: `bundle
#    validate` shows it resolved and `--debug` then prints "No script defined for postdeploy". The form that
#    actually runs is `experimental.scripts`, as a plain string — i.e. the form the schema says does not
#    exist. Measured on CLI v0.299.0.
experimental:
  scripts:
    # Runs BEFORE the source is synced, so what it writes is uploaded with the app.
    predeploy: |
      set -euo pipefail
      if [ -z "${DATABRICKS_CONFIG_PROFILE:-}" ] && [ -z "${DATABRICKS_HOST:-}" ]; then
        echo "[predeploy] ⛔ Put the auth in the ENVIRONMENT, not in -p:" >&2
        echo "[predeploy]      DATABRICKS_CONFIG_PROFILE=<profile> databricks bundle deploy -t <target>" >&2
        echo "[predeploy]    The postdeploy hook shells out to the CLI and inherits only the environment;" >&2
        echo "[predeploy]    with -p alone its calls would silently go to the DEFAULT profile's workspace." >&2
        exit 1
      fi
      python3 bootstrap/write_app_yaml.py app/app.yaml \
        "EVENT_NAME=${var.event_name}" \
        "CRUISE_DEG_S=${var.cruise_deg_s}" \
        "SPINUP_SECONDS=${var.spinup_seconds}" \
        "SPINDOWN_MIN_TURNS=${var.spindown_min_turns}" \
        "SPINDOWN_EXPONENT=${var.spindown_exponent}" \
        "BUILD_ID=${bundle.target}-${var.app_name}"
    postdeploy: |
      set -euo pipefail
      export DB_PROFILE="${DATABRICKS_CONFIG_PROFILE:-}"
      echo "[postdeploy] starting and deploying the app"
      # ⛔ A NESTED `bundle run` DOES NOT INHERIT THE OUTER DEPLOY'S `--var`. Any variable the nested run
      #    resolves — one with no default, or one referenced under `resources:` — must be forwarded, or the
      #    run resolves it back to the target default and acts on the wrong app, AFTER everything else has
      #    succeeded. Forwarded as BUNDLE_VAR_* rather than on the command line so nothing lands in a
      #    process listing.
      export BUNDLE_VAR_app_name="${var.app_name}"
      export BUNDLE_VAR_audience_group="${var.audience_group}"
      databricks bundle run spin_wheel -t "${bundle.target}"
      # ⛔ ASSERT THE END STATE, NOT THE EXIT CODE. A green deploy, "App started successfully" and `apps get`
      #    RUNNING have all been true on this rig while the container had no environment at all. A non-zero
      #    exit here FAILS the deploy, which is the point.
      python3 bootstrap/verify_deployed.py "${var.app_name}" "${bundle.target}-${var.app_name}"

targets:
  dev:
    default: true
    mode: development
    variables:
      app_name: spin-wheel

  # ── A TARGET WITH NO HOST, AND THE ABSENCE IS THE FEATURE ─────────────────────────────────────────
  # A target that pins a host can only ever be deployed into THAT workspace: the CLI refuses a profile whose
  # host differs, and its own error message helpfully suggests deploying into ours instead. So the portable
  # target takes its host from whatever you authenticate with.
  #
  #   DATABRICKS_CONFIG_PROFILE=<their-profile> databricks bundle deploy -t portable \
  #     --var app_name=spin-wheel --var event_name="Their Event"
  portable:
    variables:
      app_name: spin-wheel
